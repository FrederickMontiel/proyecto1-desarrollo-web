name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  dotnet:
    name: .NET · compilar y probar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        working-directory: services
        run: dotnet restore SWMatrc.Servicios.slnx

      - name: Compilar
        working-directory: services
        run: dotnet build SWMatrc.Servicios.slnx --configuration Release --no-restore --warnaserror

      - name: Ejecutar pruebas
        working-directory: services
        run: dotnet test SWMatrc.Servicios.slnx --configuration Release --no-build --verbosity normal

  gateway:
    name: Gateway · compilar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar
        working-directory: gateway/SWMatrc.Gateway
        run: dotnet build --configuration Release --warnaserror

  auth:
    name: Auth · compilar y probar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json

      - name: Instalar dependencias
        working-directory: services/auth-service
        run: npm ci

      - name: Compilar
        working-directory: services/auth-service
        run: npm run build

      - name: Ejecutar pruebas
        working-directory: services/auth-service
        run: npm test

  alert:
    name: Alert · compilar y probar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y probar
        working-directory: services/alert-service
        run: mvn -B package

  frontend:
    name: Frontend · compilar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar
        working-directory: frontend
        run: npm run build

  contenedores:
    name: Docker · validar configuración
    runs-on: ubuntu-latest
    needs: [dotnet, gateway, auth, alert, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose
        run: |
          cp .env.example .env
          mkdir -p secrets
          openssl genrsa 3072 > secrets/jwt-private.pem 2>/dev/null
          docker compose config --quiet
