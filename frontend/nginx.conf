# --------------------------------------------------------------------------------------
# nginx sirve la SPA y hace de proxy inverso hacia la API dentro de la red de Docker.
# Un solo origen para todo: no hay CORS que configurar y el WebSocket viaja por el mismo
# puerto que el resto del tráfico.
# --------------------------------------------------------------------------------------

# El encabezado Connection de una petición de WebSocket vale "upgrade"; en el resto viene
# vacío o con otro valor y la conexión debe cerrarse al terminar. Este mapa traduce una
# cosa en la otra para no romper las peticiones normales al reenviarlas.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api_swmatrc {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de los recursos de texto. Las imágenes y fuentes ya vienen comprimidas.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Cabeceras de endurecimiento básicas.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 4m;

    # --- API REST ---
    location /api/ {
        proxy_pass http://api_swmatrc;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # La API lee esta cabecera para registrar en bitácora la IP real del usuario y no
        # la del contenedor de nginx.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # --- Canal en tiempo real (WebSocket) ---
    location /hubs/ {
        proxy_pass http://api_swmatrc;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El socket permanece abierto entre lecturas: sin un tiempo de espera largo nginx
        # cortaría la conexión y el tablero entraría en un ciclo de reconexión continuo.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;

        # El búfer retendría los mensajes: en un canal de alertas hay que entregarlos ya.
        proxy_buffering off;
    }

    # --- Recursos con huella de contenido ---
    # El compilador de Angular incrusta el hash en el nombre, así que el archivo puede
    # cachearse indefinidamente: un cambio genera un nombre distinto.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Enrutamiento del lado del cliente ---
    # Cualquier ruta desconocida devuelve index.html para que Angular resuelva la
    # navegación; recargar /dashboard debe funcionar igual que entrar por la raíz.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: es lo que apunta a la versión vigente de los recursos.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
