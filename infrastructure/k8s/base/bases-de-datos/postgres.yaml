# --------------------------------------------------------------------------------------
# PostgreSQL 18: auth_db, community_db y alert_db, cada una con su usuario (*_svc).
# StatefulSet de una réplica con un PersistentVolumeClaim (en K3s lo atiende local-path).
# El script database/postgres/init.sh llega como ConfigMap (lo crea scripts/desplegar.sh)
# y solo se ejecuta la primera vez, con el volumen vacío.
# --------------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: base-de-datos
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: base-de-datos
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: base-de-datos
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: swmatrc-db, key: POSTGRES_PASSWORD } }
            # Los lee init.sh en el primer arranque para crear los usuarios de cada servicio.
            - name: AUTH_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: swmatrc-db, key: AUTH_DB_PASSWORD } }
            - name: COMMUNITY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: swmatrc-db, key: COMMUNITY_DB_PASSWORD } }
            - name: ALERT_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: swmatrc-db, key: ALERT_DB_PASSWORD } }
          volumeMounts:
            # PostgreSQL 18 guarda los datos en un subdirectorio por versión mayor.
            - name: datos
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: init
          configMap:
            name: db-init-postgres
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
