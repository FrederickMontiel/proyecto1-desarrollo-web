# --------------------------------------------------------------------------------------
# Escalabilidad horizontal (HorizontalPodAutoscaler) y disponibilidad (PodDisruptionBudget).
#
# K3s trae metrics-server: el HPA agrega réplicas cuando el uso de CPU supera el 70 % de lo
# solicitado (requests) y las retira cuando baja. Los PDB garantizan que un drenado de nodo
# o una actualización nunca deje un servicio sin ninguna réplica.
#
# sensor-simulador no escala: su estado vive en memoria y debe haber exactamente uno.
# --------------------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Sube rápido ante un pico; baja despacio para no oscilar.
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
---
