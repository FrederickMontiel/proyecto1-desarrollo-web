# --------------------------------------------------------------------------------------
# NetworkPolicies (K3s las aplica con su controlador embebido). Todo el tráfico entrante
# está prohibido salvo lo que se permite aquí:
#
#   Internet → Traefik (kube-system) → api-gateway, web
#   web (nginx) → api-gateway
#   api-gateway / microservicios / simulador → microservicios
#   cada base de datos ← solo los servicios dueños de sus bases
#
# Un pod comprometido no puede, por ejemplo, conectarse a SQL Server si no es de Sensor.
# Las sondas del kubelet salen del propio nodo y K3s las permite siempre.
# --------------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: denegar-entrada
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entrada-desde-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["api-gateway", "web"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
---
# El nginx del frontend también reenvía /api y /hubs al gateway (si se entra sin Ingress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-desde-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: microservicios
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: microservicio
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["gateway", "microservicio", "simulador"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["auth-service", "community-service", "alert-service"]
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sqlserver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sqlserver
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["sensor-service", "sensor-simulador", "sqlserver-init"]
      ports:
        - port: 1433
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mongo
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["report-service", "audit-service"]
      ports:
        - port: 27017
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["sensor-service", "sensor-simulador"]
      ports:
        - port: 6379
---
# cert-manager crea en este namespace los pods que responden el reto HTTP-01 de
# Let's Encrypt; Traefik debe poder llegar a ellos.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: retos-acme
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
