# Alert Service (Java 25 + Spring Boot + PostgreSQL): reglas, umbrales, alertas y eventos.
apiVersion: v1
kind: Service
metadata:
  name: alert-service
  labels:
    app.kubernetes.io/name: alert-service
    app.kubernetes.io/component: microservicio
spec:
  selector:
    app.kubernetes.io/name: alert-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  labels:
    app.kubernetes.io/name: alert-service
    app.kubernetes.io/component: microservicio
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-service
        app.kubernetes.io/component: microservicio
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: alert-service
          image: swmatrc/alert-service
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NOMBRE
              value: alert_db
            - name: DB_USUARIO
              value: alert_svc
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: swmatrc-db, key: ALERT_DB_PASSWORD } }
            - name: SERVICIO_SECRETO
              valueFrom: { secretKeyRef: { name: swmatrc-servicios, key: SVC_SECRETO_ALERT } }
            - name: JWT_EMISOR
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: JWT_EMISOR } }
            - name: JWT_AUDIENCIA
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: JWT_AUDIENCIA } }
            - name: JWT_JWKS
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: JWT_JWKS } }
            - name: URL_AUTH
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: URL_AUTH } }
            - name: URL_AUDITORIA
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: URL_AUDITORIA } }
            - name: URL_SENSOR
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: URL_SENSOR } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          # La JVM tarda en arrancar: la sonda de arranque le da hasta 3 minutos antes de
          # que entren en juego las de vida y disponibilidad.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: tmp
          emptyDir: {}
