# Report Service (Python + FastAPI + Jinja2 + WeasyPrint + MongoDB/GridFS): reportes PDF y dashboard.
apiVersion: v1
kind: Service
metadata:
  name: report-service
  labels:
    app.kubernetes.io/name: report-service
    app.kubernetes.io/component: microservicio
spec:
  selector:
    app.kubernetes.io/name: report-service
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  labels:
    app.kubernetes.io/name: report-service
    app.kubernetes.io/component: microservicio
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: report-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: report-service
        app.kubernetes.io/component: microservicio
    spec:
      # Al recibir SIGTERM espera a que terminen los PDF en curso.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: report-service
          image: swmatrc/report-service
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MONGO_HOST
              value: mongo
            - name: MONGO_BASE
              value: report_db
            - name: MONGO_USUARIO
              value: report_svc
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: swmatrc-db, key: REPORT_DB_PASSWORD } }
            - name: SERVICIO_SECRETO
              valueFrom: { secretKeyRef: { name: swmatrc-servicios, key: SVC_SECRETO_REPORT } }
            - name: AUTH_URL_METADATOS
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: AUTH_URL_METADATOS } }
            - name: JWT_EMISOR
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: JWT_EMISOR } }
            - name: JWT_AUDIENCIA
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: JWT_AUDIENCIA } }
            - name: URL_AUTH
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: URL_AUTH } }
            - name: URL_COMMUNITY
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: URL_COMMUNITY } }
            - name: URL_SENSOR
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: URL_SENSOR } }
            - name: URL_ALERT
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: URL_ALERT } }
            - name: URL_AUDITORIA
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: URL_AUDITORIA } }
            - name: ZONA_HORARIA
              valueFrom: { configMapKeyRef: { name: swmatrc-config, key: ZONA_HORARIA } }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
