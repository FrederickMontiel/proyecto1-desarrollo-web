# --------------------------------------------------------------------------------------
# Toda la configuración se sobrescribe con variables de entorno (Compose, ConfigMap y
# Secret de Kubernetes). Los valores de aquí son los de la red interna de Docker.
# --------------------------------------------------------------------------------------

server:
  port: 8080
  # Al recibir SIGTERM deja de aceptar peticiones y termina las que están en curso.
  shutdown: graceful
  server-header: ""
  # El gateway manda la IP real del cliente en X-Forwarded-For. Tomcat solo la acepta de
  # proxies de redes privadas (la red de Docker), así que desde fuera no se puede falsificar.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: alert-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NOMBRE:alert_db}
    username: ${DB_USUARIO:alert_svc}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      # Si PostgreSQL todavía no está listo, el servicio espera en lugar de morir al arrancar.
      initialization-fail-timeout: 60000

  jpa:
    open-in-view: false
    hibernate:
      # El esquema solo cambia por migraciones de Flyway, versionadas en db/migration.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # /health/live: el proceso responde. /health/ready: además PostgreSQL contesta.
        live:
          include: livenessState
        ready:
          include: readinessState,db

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlacion:-}] %logger{30} : %m%n"
  level:
    root: INFO
    org.hibernate.SQL: WARN

swmatrc:
  servicio:
    nombre: alert-service
    secreto: ${SERVICIO_SECRETO:}
    url-auth: ${URL_AUTH:http://auth-service:3000}
    url-auditoria: ${URL_AUDITORIA:http://audit-service:8000}
    url-sensor: ${URL_SENSOR:http://sensor-service:8080}
  jwt:
    emisor: ${JWT_EMISOR:swmatrc-auth}
    audiencia: ${JWT_AUDIENCIA:swmatrc-web}
    audiencia-interna: ${JWT_AUDIENCIA_INTERNA:swmatrc-internal}
    jwks: ${JWT_JWKS:http://auth-service:3000/.well-known/jwks.json}
